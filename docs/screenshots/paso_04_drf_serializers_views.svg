      </g>

      <!-- Code Line Output -->
      <text x="45" y="100">
        <tspan x="45" dy="22" fill="#745845" font-size="12" font-family="monospace"> 1</tspan><tspan x="85" fill="#221a15" font-size="13" font-family="monospace"># Serializadores DRF</tspan><tspan x="45" dy="22" fill="#745845" font-size="12" font-family="monospace"> 2</tspan><tspan x="85" fill="#221a15" font-size="13" font-family="monospace">class CategoriaSerializer(serializers.ModelSerializer):</tspan><tspan x="45" dy="22" fill="#745845" font-size="12" font-family="monospace"> 3</tspan><tspan x="85" fill="#221a15" font-size="13" font-family="monospace">    total_productos = serializers.IntegerField(source=&#x27;productos.count&#x27;, read_only=True)</tspan><tspan x="45" dy="22" fill="#745845" font-size="12" font-family="monospace"> 4</tspan><tspan x="85" fill="#221a15" font-size="13" font-family="monospace">    class Meta:</tspan><tspan x="45" dy="22" fill="#745845" font-size="12" font-family="monospace"> 5</tspan><tspan x="85" fill="#221a15" font-size="13" font-family="monospace">        model = Categoria</tspan><tspan x="45" dy="22" fill="#745845" font-size="12" font-family="monospace"> 6</tspan><tspan x="85" fill="#221a15" font-size="13" font-family="monospace">        fields = [&#x27;id&#x27;, &#x27;nombre&#x27;, &#x27;descripcion&#x27;, &#x27;total_productos&#x27;]</tspan><tspan x="45" dy="22" fill="#745845" font-size="12" font-family="monospace"> 7</tspan><tspan x="85" fill="#221a15" font-size="13" font-family="monospace"></tspan><tspan x="45" dy="22" fill="#745845" font-size="12" font-family="monospace"> 8</tspan><tspan x="85" fill="#221a15" font-size="13" font-family="monospace">class ProductoSerializer(serializers.ModelSerializer):</tspan><tspan x="45" dy="22" fill="#745845" font-size="12" font-family="monospace"> 9</tspan><tspan x="85" fill="#221a15" font-size="13" font-family="monospace">    categoria_nombre = serializers.ReadOnlyField(source=&#x27;categoria.nombre&#x27;)</tspan><tspan x="45" dy="22" fill="#745845" font-size="12" font-family="monospace">10</tspan><tspan x="85" fill="#221a15" font-size="13" font-family="monospace">    class Meta:</tspan><tspan x="45" dy="22" fill="#745845" font-size="12" font-family="monospace">11</tspan><tspan x="85" fill="#221a15" font-size="13" font-family="monospace">        model = Producto</tspan><tspan x="45" dy="22" fill="#745845" font-size="12" font-family="monospace">12</tspan><tspan x="85" fill="#221a15" font-size="13" font-family="monospace">        fields = [&#x27;id&#x27;, &#x27;nombre&#x27;, &#x27;descripcion&#x27;, &#x27;precio&#x27;, &#x27;imagen&#x27;, &#x27;cantidad_disponible&#x27;, &#x27;categoria&#x27;, &#x27;categoria_nombre&#x27;]</tspan><tspan x="45" dy="22" fill="#745845" font-size="12" font-family="monospace">13</tspan><tspan x="85" fill="#221a15" font-size="13" font-family="monospace"></tspan><tspan x="45" dy="22" fill="#745845" font-size="12" font-family="monospace">14</tspan><tspan x="85" fill="#221a15" font-size="13" font-family="monospace"># ViewSets con filtrado por categoría</tspan><tspan x="45" dy="22" fill="#745845" font-size="12" font-family="monospace">15</tspan><tspan x="85" fill="#221a15" font-size="13" font-family="monospace">class ProductoViewSet(viewsets.ReadOnlyModelViewSet):</tspan><tspan x="45" dy="22" fill="#745845" font-size="12" font-family="monospace">16</tspan><tspan x="85" fill="#221a15" font-size="13" font-family="monospace">    serializer_class = ProductoSerializer</tspan><tspan x="45" dy="22" fill="#745845" font-size="12" font-family="monospace">17</tspan><tspan x="85" fill="#221a15" font-size="13" font-family="monospace">    def get_queryset(self):</tspan><tspan x="45" dy="22" fill="#745845" font-size="12" font-family="monospace">18</tspan><tspan x="85" fill="#221a15" font-size="13" font-family="monospace">        queryset = Producto.objects.select_related(&#x27;categoria&#x27;).all()</tspan><tspan x="45" dy="22" fill="#745845" font-size="12" font-family="monospace">19</tspan><tspan x="85" fill="#221a15" font-size="13" font-family="monospace">        categoria_id = self.request.query_params.get(&#x27;categoria&#x27;, None)</tspan><tspan x="45" dy="22" fill="#745845" font-size="12" font-family="monospace">20</tspan><tspan x="85" fill="#221a15" font-size="13" font-family="monospace">        if categoria_id is not None:</tspan><tspan x="45" dy="22" fill="#745845" font-size="12" font-family="monospace">21</tspan><tspan x="85" fill="#221a15" font-size="13" font-family="monospace">            queryset = queryset.filter(categoria_id=categoria_id)</tspan><tspan x="45" dy="22" fill="#745845" font-size="12" font-family="monospace">22</tspan><tspan x="85" fill="#221a15" font-size="13" font-family="monospace">        return queryset</tspan>
      </text>
    </svg>