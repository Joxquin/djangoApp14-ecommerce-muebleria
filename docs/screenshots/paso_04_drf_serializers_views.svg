        <circle cx="95" cy="54" r="6.5" fill="#10b981"/>

        <!-- Title & Path -->
        <text x="125" y="58" fill="#301400" font-family="system-ui, sans-serif" font-weight="700" font-size="14">Ejercicio 04 - Serializadores y Endpoints REST</text>
        <text x="460" y="58" fill="#745845" font-family="monospace" font-size="12">backend/catalogo/serializers.py y views.py</text>

        <!-- Badge -->
        <rect x="730" y="41" width="125" height="26" rx="13" fill="#944b00"/>
