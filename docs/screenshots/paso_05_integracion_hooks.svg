<svg xmlns="http://www.w3.org/2000/svg" width="900" height="843" viewBox="0 0 900 843">
      <defs>
        <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
          <feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#221a15" flood-opacity="0.12"/>
        </filter>
        <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#ffdcc3"/>
          <stop offset="100%" stop-color="#fedcc6"/>
        </linearGradient>
      </defs>

      <!-- Base Canvas Background -->
      <rect width="100%" height="100%" fill="#fff8f5" rx="28"/>

      <!-- Window Container Card (M3 Expressive) -->
      <g filter="url(#shadow)">
        <rect x="25" y="25" width="850" height="793" rx="24" fill="#ffffff" stroke="#f1e5df" stroke-width="1.5"/>
        
        <!-- Window Top Bar -->
        <rect x="25" y="25" width="850" height="58" rx="24" fill="url(#headerGrad)"/>
        <rect x="25" y="60" width="850" height="23" fill="url(#headerGrad)"/>
        
        <!-- Window Dots -->
        <circle cx="55" cy="54" r="6.5" fill="#ba1a1a"/>
        <circle cx="75" cy="54" r="6.5" fill="#f59e0b"/>
        <circle cx="95" cy="54" r="6.5" fill="#10b981"/>

        <!-- Title & Path -->
        <text x="125" y="58" fill="#301400" font-family="system-ui, sans-serif" font-weight="700" font-size="14">Ejercicio 05 - Integración con Hooks de Estado</text>
        <text x="460" y="58" fill="#745845" font-family="monospace" font-size="12">frontend/src/pages/CatalogPage.jsx</text>

        <!-- Badge -->
        <rect x="730" y="41" width="125" height="26" rx="13" fill="#944b00"/>
        <text x="792" y="58" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="600" font-size="11" text-anchor="middle">React Hooks</text>
      </g>

      <!-- Code Line Output -->
      <text x="45" y="100">
        <tspan x="45" dy="22" fill="#745845" font-size="12" font-family="monospace"> 1</tspan><tspan x="85" fill="#221a15" font-size="13" font-family="monospace">export function CatalogPage() {</tspan><tspan x="45" dy="22" fill="#745845" font-size="12" font-family="monospace"> 2</tspan><tspan x="85" fill="#221a15" font-size="13" font-family="monospace">  const [categorias, setCategorias] = useState([]);</tspan><tspan x="45" dy="22" fill="#745845" font-size="12" font-family="monospace"> 3</tspan><tspan x="85" fill="#221a15" font-size="13" font-family="monospace">  const [productos, setProductos] = useState([]);</tspan><tspan x="45" dy="22" fill="#745845" font-size="12" font-family="monospace"> 4</tspan><tspan x="85" fill="#221a15" font-size="13" font-family="monospace">  const [selectedCategoryId, setSelectedCategoryId] = useState(null);</tspan><tspan x="45" dy="22" fill="#745845" font-size="12" font-family="monospace"> 5</tspan><tspan x="85" fill="#221a15" font-size="13" font-family="monospace">  const [loading, setLoading] = useState(true);</tspan><tspan x="45" dy="22" fill="#745845" font-size="12" font-family="monospace"> 6</tspan><tspan x="85" fill="#221a15" font-size="13" font-family="monospace"></tspan><tspan x="45" dy="22" fill="#745845" font-size="12" font-family="monospace"> 7</tspan><tspan x="85" fill="#221a15" font-size="13" font-family="monospace">  useEffect(() =&gt; {</tspan><tspan x="45" dy="22" fill="#745845" font-size="12" font-family="monospace"> 8</tspan><tspan x="85" fill="#221a15" font-size="13" font-family="monospace">    async function loadData() {</tspan><tspan x="45" dy="22" fill="#745845" font-size="12" font-family="monospace"> 9</tspan><tspan x="85" fill="#221a15" font-size="13" font-family="monospace">      try {</tspan><tspan x="45" dy="22" fill="#745845" font-size="12" font-family="monospace">10</tspan><tspan x="85" fill="#221a15" font-size="13" font-family="monospace">        setLoading(true);</tspan><tspan x="45" dy="22" fill="#745845" font-size="12" font-family="monospace">11</tspan><tspan x="85" fill="#221a15" font-size="13" font-family="monospace">        const [catsData, prodsData] = await Promise.all([</tspan><tspan x="45" dy="22" fill="#745845" font-size="12" font-family="monospace">12</tspan><tspan x="85" fill="#221a15" font-size="13" font-family="monospace">          getCategorias(),</tspan><tspan x="45" dy="22" fill="#745845" font-size="12" font-family="monospace">13</tspan><tspan x="85" fill="#221a15" font-size="13" font-family="monospace">          getProductos(selectedCategoryId)</tspan><tspan x="45" dy="22" fill="#745845" font-size="12" font-family="monospace">14</tspan><tspan x="85" fill="#221a15" font-size="13" font-family="monospace">        ]);</tspan><tspan x="45" dy="22" fill="#745845" font-size="12" font-family="monospace">15</tspan><tspan x="85" fill="#221a15" font-size="13" font-family="monospace">        setCategorias(catsData);</tspan><tspan x="45" dy="22" fill="#745845" font-size="12" font-family="monospace">16</tspan><tspan x="85" fill="#221a15" font-size="13" font-family="monospace">        setProductos(prodsData);</tspan><tspan x="45" dy="22" fill="#745845" font-size="12" font-family="monospace">17</tspan><tspan x="85" fill="#221a15" font-size="13" font-family="monospace">      } finally {</tspan><tspan x="45" dy="22" fill="#745845" font-size="12" font-family="monospace">18</tspan><tspan x="85" fill="#221a15" font-size="13" font-family="monospace">        setLoading(false);</tspan><tspan x="45" dy="22" fill="#745845" font-size="12" font-family="monospace">19</tspan><tspan x="85" fill="#221a15" font-size="13" font-family="monospace">      }</tspan><tspan x="45" dy="22" fill="#745845" font-size="12" font-family="monospace">20</tspan><tspan x="85" fill="#221a15" font-size="13" font-family="monospace">    }</tspan><tspan x="45" dy="22" fill="#745845" font-size="12" font-family="monospace">21</tspan><tspan x="85" fill="#221a15" font-size="13" font-family="monospace">    loadData();</tspan><tspan x="45" dy="22" fill="#745845" font-size="12" font-family="monospace">22</tspan><tspan x="85" fill="#221a15" font-size="13" font-family="monospace">  }, [selectedCategoryId]);</tspan><tspan x="45" dy="22" fill="#745845" font-size="12" font-family="monospace">23</tspan><tspan x="85" fill="#221a15" font-size="13" font-family="monospace"></tspan><tspan x="45" dy="22" fill="#745845" font-size="12" font-family="monospace">24</tspan><tspan x="85" fill="#221a15" font-size="13" font-family="monospace">  return (</tspan><tspan x="45" dy="22" fill="#745845" font-size="12" font-family="monospace">25</tspan><tspan x="85" fill="#221a15" font-size="13" font-family="monospace">    &lt;div className=&quot;min-h-screen bg-[#fff8f5]&quot;&gt;</tspan><tspan x="45" dy="22" fill="#745845" font-size="12" font-family="monospace">26</tspan><tspan x="85" fill="#221a15" font-size="13" font-family="monospace">      &lt;Header totalProducts={productos.length} /&gt;</tspan><tspan x="45" dy="22" fill="#745845" font-size="12" font-family="monospace">27</tspan><tspan x="85" fill="#221a15" font-size="13" font-family="monospace">      &lt;CategoryFilter categorias={categorias} selectedCategoryId={selectedCategoryId} onSelectCategory={setSelectedCategoryId} /&gt;</tspan><tspan x="45" dy="22" fill="#745845" font-size="12" font-family="monospace">28</tspan><tspan x="85" fill="#221a15" font-size="13" font-family="monospace">      &lt;ProductList productos={productos} loading={loading} /&gt;</tspan><tspan x="45" dy="22" fill="#745845" font-size="12" font-family="monospace">29</tspan><tspan x="85" fill="#221a15" font-size="13" font-family="monospace">    &lt;/div&gt;</tspan><tspan x="45" dy="22" fill="#745845" font-size="12" font-family="monospace">30</tspan><tspan x="85" fill="#221a15" font-size="13" font-family="monospace">  );</tspan><tspan x="45" dy="22" fill="#745845" font-size="12" font-family="monospace">31</tspan><tspan x="85" fill="#221a15" font-size="13" font-family="monospace">}</tspan>
      </text>
    </svg>