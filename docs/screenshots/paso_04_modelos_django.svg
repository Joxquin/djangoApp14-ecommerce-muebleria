<svg xmlns="http://www.w3.org/2000/svg" width="900" height="429" viewBox="0 0 900 429">
      <defs>
        <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
          <feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#221a15" flood-opacity="0.12"/>
        </filter>
        <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#ffdcc3"/>
          <stop offset="100%" stop-color="#fedcc6"/>
        </linearGradient>
      </defs>

      <!-- Base Canvas Background -->
      <rect width="100%" height="100%" fill="#fff8f5" rx="28"/>

      <!-- Window Container Card (M3 Expressive) -->
      <g filter="url(#shadow)">
        <rect x="25" y="25" width="850" height="379" rx="24" fill="#ffffff" stroke="#f1e5df" stroke-width="1.5"/>
        
        <!-- Window Top Bar -->
        <rect x="25" y="25" width="850" height="58" rx="24" fill="url(#headerGrad)"/>
        <rect x="25" y="60" width="850" height="23" fill="url(#headerGrad)"/>
        
        <!-- Window Dots -->
        <circle cx="55" cy="54" r="6.5" fill="#ba1a1a"/>
        <circle cx="75" cy="54" r="6.5" fill="#f59e0b"/>
        <circle cx="95" cy="54" r="6.5" fill="#10b981"/>

        <!-- Title & Path -->
        <text x="125" y="58" fill="#301400" font-family="system-ui, sans-serif" font-weight="700" font-size="14">Ejercicio 04 - Modelos ORM Django</text>
        <text x="460" y="58" fill="#745845" font-family="monospace" font-size="12">backend/catalogo/models.py</text>

        <!-- Badge -->
        <rect x="730" y="41" width="125" height="26" rx="13" fill="#944b00"/>
        <text x="792" y="58" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="600" font-size="11" text-anchor="middle">Django ORM</text>
      </g>

      <!-- Code Line Output -->
      <text x="45" y="100">
        <tspan x="45" dy="22" fill="#745845" font-size="12" font-family="monospace"> 1</tspan><tspan x="85" fill="#221a15" font-size="13" font-family="monospace">class Categoria(models.Model):</tspan><tspan x="45" dy="22" fill="#745845" font-size="12" font-family="monospace"> 2</tspan><tspan x="85" fill="#221a15" font-size="13" font-family="monospace">    nombre = models.CharField(max_length=100, unique=True, verbose_name=&quot;Nombre de Categoría&quot;)</tspan><tspan x="45" dy="22" fill="#745845" font-size="12" font-family="monospace"> 3</tspan><tspan x="85" fill="#221a15" font-size="13" font-family="monospace">    descripcion = models.TextField(blank=True, null=True, verbose_name=&quot;Descripción&quot;)</tspan><tspan x="45" dy="22" fill="#745845" font-size="12" font-family="monospace"> 4</tspan><tspan x="85" fill="#221a15" font-size="13" font-family="monospace">    creado_en = models.DateTimeField(auto_now_add=True)</tspan><tspan x="45" dy="22" fill="#745845" font-size="12" font-family="monospace"> 5</tspan><tspan x="85" fill="#221a15" font-size="13" font-family="monospace"></tspan><tspan x="45" dy="22" fill="#745845" font-size="12" font-family="monospace"> 6</tspan><tspan x="85" fill="#221a15" font-size="13" font-family="monospace">class Producto(models.Model):</tspan><tspan x="45" dy="22" fill="#745845" font-size="12" font-family="monospace"> 7</tspan><tspan x="85" fill="#221a15" font-size="13" font-family="monospace">    nombre = models.CharField(max_length=200, verbose_name=&quot;Nombre del Producto&quot;)</tspan><tspan x="45" dy="22" fill="#745845" font-size="12" font-family="monospace"> 8</tspan><tspan x="85" fill="#221a15" font-size="13" font-family="monospace">    descripcion = models.TextField(verbose_name=&quot;Descripción Detallada&quot;)</tspan><tspan x="45" dy="22" fill="#745845" font-size="12" font-family="monospace"> 9</tspan><tspan x="85" fill="#221a15" font-size="13" font-family="monospace">    precio = models.DecimalField(max_digits=10, decimal_places=2, verbose_name=&quot;Precio (PEN)&quot;)</tspan><tspan x="45" dy="22" fill="#745845" font-size="12" font-family="monospace">10</tspan><tspan x="85" fill="#221a15" font-size="13" font-family="monospace">    imagen = models.URLField(max_length=500, verbose_name=&quot;URL de la Imagen&quot;)</tspan><tspan x="45" dy="22" fill="#745845" font-size="12" font-family="monospace">11</tspan><tspan x="85" fill="#221a15" font-size="13" font-family="monospace">    cantidad_disponible = models.PositiveIntegerField(default=0, verbose_name=&quot;Cantidad Disponible&quot;)</tspan><tspan x="45" dy="22" fill="#745845" font-size="12" font-family="monospace">12</tspan><tspan x="85" fill="#221a15" font-size="13" font-family="monospace">    categoria = models.ForeignKey(Categoria, on_delete=models.CASCADE, related_name=&#x27;productos&#x27;)</tspan><tspan x="45" dy="22" fill="#745845" font-size="12" font-family="monospace">13</tspan><tspan x="85" fill="#221a15" font-size="13" font-family="monospace">    creado_en = models.DateTimeField(auto_now_add=True)</tspan>
      </text>
    </svg>